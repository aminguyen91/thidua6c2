<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hệ Thống Quản Lý Thi Đua & Thành Tích Học Sinh</title>
  <style>
    :root {
      --bg-main: #fdfbf7;
      --bg-card: #ffffff;
      --pastel-pink: #ffd6e0;
      --pastel-pink-dark: #e86f8c;
      --pastel-blue: #d4e8ff;
      --pastel-blue-dark: #4a89dc;
      --pastel-mint: #d3f8e2;
      --pastel-mint-dark: #2e9e66;
      --pastel-yellow: #fff3c4;
      --pastel-yellow-dark: #d99b00;
      --pastel-purple: #e8dff5;
      --pastel-purple-dark: #7b52ab;
      --pastel-red: #ffe0e0;
      --pastel-red-dark: #d94343;
      --text-main: #333842;
      --text-muted: #6c757d;
      --border-color: #ece8e1;
      --shadow: 0 6px 20px rgba(74, 85, 104, 0.06);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fdfbf7 0%, #f4f8ff 50%, #fff6f9 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Header */
    header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--border-color);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.03);
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #2b303a;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      border: none;
      padding: 9px 15px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(0.97);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--pastel-blue);
      color: #1f5ca8;
    }

    .btn-success {
      background: var(--pastel-mint);
      color: #1e7348;
    }

    .btn-warning {
      background: var(--pastel-yellow);
      color: #8f6400;
    }

    .btn-purple {
      background: var(--pastel-purple);
      color: #5a3882;
    }

    .btn-danger {
      background: var(--pastel-red);
      color: #b02a2a;
    }

    .btn-outline {
      background: #fff;
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    /* Navigation Tabs */
    .nav-tabs {
      max-width: 1280px;
      margin: 20px auto 0;
      padding: 0 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 11px 20px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      background: rgba(255, 255, 255, 0.75);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #fff;
      color: #2b303a;
      border-color: var(--pastel-blue);
      box-shadow: var(--shadow);
    }

    /* Main Layout */
    main {
      max-width: 1280px;
      margin: 20px auto 0;
      padding: 0 24px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Grids */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      border: 1.5px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card-title {
      font-size: 1.08rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Summary Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      padding: 18px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: var(--shadow);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .stat-info h3 {
      font-size: 1.45rem;
      font-weight: 800;
    }

    .stat-info p {
      font-size: 0.84rem;
      opacity: 0.85;
      font-weight: 600;
    }

    /* Teams Grid */
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
    }

    .team-card {
      background: #fff;
      border-radius: var(--radius);
      border: 2px solid var(--border-color);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .team-header {
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-title-wrap h3 {
      font-size: 1.12rem;
      font-weight: 700;
    }

    .team-title-wrap span {
      font-size: 0.82rem;
      opacity: 0.85;
      font-weight: 600;
    }

    .team-score-badge {
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .team-actions-bar {
      padding: 10px 16px;
      background: #faf9f6;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .student-list {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .student-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fdfcfa;
      border: 1px solid var(--border-color);
      transition: all 0.15s;
      gap: 8px;
    }

    .student-item:hover {
      background: #f5f9ff;
      border-color: var(--pastel-blue);
    }

    .student-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .student-name {
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-pill {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .student-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-chip {
      font-weight: 800;
      font-size: 0.92rem;
      padding: 4px 10px;
      border-radius: 8px;
      min-width: 52px;
      text-align: center;
    }

    .score-pos {
      background: var(--pastel-mint);
      color: #1b6e44;
    }

    .score-neg {
      background: var(--pastel-red);
      color: #b02a2a;
    }

    .score-zero {
      background: #f1f3f5;
      color: #495057;
    }

    /* Rules Section */
    .rules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .rule-card {
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .rule-card.positive {
      background: #f4fcf8;
      border-color: #bfead2;
    }

    .rule-card.negative {
      background: #fff6f6;
      border-color: #f7caca;
    }

    .rule-points {
      font-size: 1.1rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .rule-card.positive .rule-points {
      background: var(--pastel-mint);
      color: #1b6e44;
    }

    .rule-card.negative .rule-points {
      background: var(--pastel-red);
      color: #b02a2a;
    }

    /* Leaderboard */
    .leaderboard-split {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 20px;
    }

    @media (max-width: 860px) {
      .leaderboard-split {
        grid-template-columns: 1fr;
      }
    }

    .rank-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      background: #fff;
    }

    .rank-row.top-1 { background: linear-gradient(90deg, #fff8db, #ffffff); border-color: #ffe066; }
    .rank-row.top-2 { background: linear-gradient(90deg, #f1f5f9, #ffffff); border-color: #cbd5e1; }
.rank-row.top-3 { background: linear-gradient(90deg, #ffedd5, #ffffff); border-color: #fed7aa; }
.rank-left {
display: flex;
align-items: center;
gap: 12px;
}
.rank-medal {
width: 32px;
height: 32px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-weight: 800;
font-size: 0.9rem;
background: #f1f3f5;
}
/* History Table */
.table-wrap {
overflow-x: auto;
}
table {
width: 100%;
border-collapse: collapse;
font-size: 0.9rem;
}
th, td {
padding: 12px 14px;
text-align: left;
border-bottom: 1px solid var(--border-color);
}
th {
background: #f8f7f4;
font-weight: 700;
color: #495057;
}
/* Forms & Inputs */
.form-row {
display: flex;
flex-wrap: wrap;
gap: 10px;
margin-bottom: 16px;
}
input, select {
padding: 9px 13px;
border-radius: 10px;
border: 1.5px solid var(--border-color);
font-size: 0.9rem;
background: #fff;
color: var(--text-main);
outline: none;
}
input:focus, select:focus {
border-color: var(--pastel-blue-dark);
}
/* Modal */
.modal-backdrop {
position: fixed;
inset: 0;
background: rgba(30, 35, 45, 0.45);
backdrop-filter: blur(3px);
display: none;
align-items: center;
justify-content: center;
z-index: 999;
padding: 16px;
}
.modal-backdrop.open {
display: flex;
}
.modal {
background: #fff;
border-radius: 20px;
max-width: 540px;
width: 100%;
padding: 24px;
box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
animation: fadeIn 0.2s ease;
max-height: 90vh;
overflow-y: auto;
}
.modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 16px;
padding-bottom: 12px;
border-bottom: 1.5px solid var(--border-color);
}
.close-btn {
background: #f1f3f5;
border: none;
width: 32px;
height: 32px;
border-radius: 50%;
font-size: 1.1rem;
cursor: pointer;
}
.quick-rules-list {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 16px;
}
@media (max-width: 500px) {
.quick-rules-list { grid-template-columns: 1fr; }
}
.quick-rule-btn {
padding: 12px;
border-radius: 12px;
border: 1.5px solid var(--border-color);
background: #fff;
text-align: left;
cursor: pointer;
display: flex;
justify-content: space-between;
align-items: center;
gap: 8px;
transition: all 0.15s;
}
.quick-rule-btn.pos:hover { background: #e8fbf0; border-color: #74d69f; }
.quick-rule-btn.neg:hover { background: #ffeded; border-color: #f28b8b; }
/* Toast */
.toast {
position: fixed;
bottom: 24px;
right: 24px;
background: #2b303a;
color: #fff;
padding: 12px 18px;
border-radius: 12px;
font-size: 0.9rem;
font-weight: 600;
box-shadow: 0 10px 25px rgba(0,0,0,0.18);
transform: translateY(100px);
opacity: 0;
transition: all 0.3s ease;
z-index: 1000;
}
.toast.show {
transform: translateY(0);
opacity: 1;
}
.empty-state {
text-align: center;
padding: 24px;
color: var(--text-muted);
font-size: 0.9rem;
}
